[package]
name = "wm-domain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
# Serde enforces unknown-field rejection at runtime; it does not alter TS shapes.
ts-rs = { workspace = true, features = ["no-serde-warnings"] }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[[bin]]
name = "export-contracts"
path = "src/bin/export_contracts.rs"

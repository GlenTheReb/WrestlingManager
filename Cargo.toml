[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/wm-domain",
    "crates/wm-persistence",
    "crates/wm-sim",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
proptest = "1.11.0"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
serde_json = "1.0"
rand_chacha = "=0.9.0"
rand_core = "=0.9.5"
